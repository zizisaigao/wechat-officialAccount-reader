name: Collect articles
on:
  workflow_dispatch:
    inputs:
      account:
        description: '公众号名称'
        required: true
        default: '郭磊宏观茶座'
        type: string
      pages:
        description: '最多抓取页数，每页20篇；实测匿名列表前10页可用'
        type: choice
        options: ['1', '3', '5', '10', '25', '50']
        default: '1'
      channel:
        description: '可选：已核验的 Reportify 专栏ID；通常不需要'
        required: false
        type: string
      seed_urls:
        description: '可选：填入公开文章URL时改用候选详情采集模式，每行一个'
        required: false
        type: string
  push:
    paths: ['.github/workflows/collect.yml']
permissions:
  contents: read
concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect public metadata
        env:
          ACCOUNT: ${{ inputs.account || '郭磊宏观茶座' }}
          SEED_URLS: ${{ inputs.seed_urls }}
          CHANNEL: ${{ inputs.channel }}
          PAGES: ${{ inputs.pages || '10' }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          seed_text = os.environ.get('SEED_URLS', '').strip()
          if seed_text:
              seeds = pathlib.Path('candidate-urls.txt')
              seeds.write_text(seed_text, encoding='utf-8')
              args = [sys.executable, 'reader.py', os.environ['ACCOUNT'], '--seeds', str(seeds), '--pages', '0', '--out', 'output', '--limit', '30']
          else:
              args = [sys.executable, 'crawl.py', os.environ['ACCOUNT'], '--pages', os.environ['PAGES'], '--out', 'output', '--strict']
              if os.environ.get('CHANNEL'):
                  args += ['--channel', os.environ['CHANNEL']]
          raise SystemExit(subprocess.run(args, check=False).returncode)
      - name: Verify public name lookup separately
        if: github.event_name == 'push'
        shell: python
        run: |
          import json, pathlib, sys
          sys.path.insert(0, str(pathlib.Path.cwd()))
          from crawl import resolve_channel
          from reader import Client, ReaderError
          try:
              result = {'account':'郭磊宏观茶座', 'lookup_without_registry':resolve_channel(Client(), '郭磊宏观茶座', {})}
          except ReaderError as exc:
              result = {'account':'郭磊宏观茶座', 'lookup_without_registry_error':str(exc)}
          print(json.dumps(result, ensure_ascii=False))
          pathlib.Path('output/discovery-check.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
      - name: Show collection summary
        if: always()
        shell: python
        run: |
          import json, pathlib
          report = pathlib.Path('output/run.json')
          if report.exists(): print(report.read_text(encoding='utf-8'))
          rows_file = pathlib.Path('output/articles.json')
          if rows_file.exists():
              rows = json.loads(rows_file.read_text(encoding='utf-8'))
              print(json.dumps(rows[:3], ensure_ascii=False, indent=2))
              print('DATE_RANGE', min((r['published_at'] for r in rows),default=''), max((r['published_at'] for r in rows),default=''))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-articles-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 14
