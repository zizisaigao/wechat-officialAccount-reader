name: Collect articles
on:
  workflow_dispatch:
    inputs:
      account:
        description: '公众号名称'
        required: true
        default: '郭磊宏观茶座'
        type: string
      seed_urls:
        description: 'AI检索得到的 Reportify 公开文章 URL，每行一个；不填则运行内置样例'
        required: false
        type: string
      pages:
        description: '公开标题索引页数'
        type: choice
        options: ['0', '1', '2', '3', '4', '5']
        default: '1'
  push:
    paths: ['.github/workflows/collect.yml']
permissions:
  contents: read
concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect public metadata
        env:
          ACCOUNT: ${{ inputs.account || '郭磊宏观茶座' }}
          SEED_URLS: ${{ inputs.seed_urls }}
          PAGES: ${{ inputs.pages || '1' }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          seeds = pathlib.Path('candidate-urls.txt')
          seeds.write_text(os.environ.get('SEED_URLS', ''), encoding='utf-8')
          args = [sys.executable, 'reader.py', os.environ['ACCOUNT'], '--seeds', str(seeds), '--pages', os.environ['PAGES'], '--out', 'output', '--limit', '30']
          result = subprocess.run(args, check=False)
          raise SystemExit(result.returncode)
      - name: Show recovered metadata
        if: always()
        shell: python
        run: |
          import pathlib
          for name in ['run.json', 'articles.json']:
              path = pathlib.Path('output') / name
              if path.exists():
                  print(name)
                  print(path.read_text(encoding='utf-8')[:30000])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-articles-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 14
