name: Verify account
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/verify-account.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public account search client
        shell: python
        run: |
          import urllib.request, urllib.error, re, json, time, pathlib
          out=pathlib.Path('verification-output');out.mkdir(exist_ok=True)
          def get(url):
              time.sleep(1.5)
              req=urllib.request.Request(url,headers={'User-Agent':'wechat-officialAccount-reader/0.1'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  if r.status != 200: raise RuntimeError('HTTP '+str(r.status))
                  return r.read(4000000).decode('utf-8','replace')
          urls=['https://files.reportify.cc/fe-static/_next/static/chunks/13910-29bd235562b18499.js','https://files.reportify.cc/fe-static/_next/static/chunks/39500-3fd89597424e4fe2.js']
          try:
              page=get('https://reportify.cn/following/subscribe')
              urls += [s for s in re.findall(r'<script[^>]*src="([^"]+)"',page) if '/app/' in s and '/following/' in s]
              print('CLIENTS',urls)
              for n,url in enumerate(urls):
                  js=get(url); (out/('client-'+str(n)+'.txt')).write_text(js,encoding='utf-8')
                  print('SOURCE',url)
                  for pattern in [r'channelService',r'/channels',r'd=s\(',r'channel_category',r'channel_name',r'lh:\(\)=>']:
                      for m in list(re.finditer(pattern,js))[:4]:print('HINT',pattern,js[max(0,m.start()-130):m.start()+1500])
          except Exception as e: print('STOP',type(e).__name__,str(e)[:200])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-verification-${{ github.run_id }}
          path: verification-output/
          retention-days: 1
          if-no-files-found: error
