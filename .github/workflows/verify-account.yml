name: Verify account
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/verify-account.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Inspect public account attribution and article links
        shell: python
        run: |
          import urllib.request, urllib.error, urllib.parse, re, json, time, pathlib
          from bs4 import BeautifulSoup
          out=pathlib.Path('verification-output');out.mkdir(exist_ok=True)
          urls=['https://www.ageclub.net/article-detail/10292','https://www.10100.com/article/22580561','https://www.jintiankansha.me/u/bEQAaNCVTG','https://mp.weixin.qq.com/s/QW6gEA3mHzfxRvZL38X1Pw','https://synapse.zhihuiya.com/drug/883f45d7e7654f0b99cc4f285abb3ae2']
          observations=[];blocked=set()
          for url in urls:
              host=urllib.parse.urlsplit(url).hostname
              if host in blocked: continue
              time.sleep(1.5)
              print('SOURCE',url,flush=True)
              result={'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'wechat-officialAccount-reader/0.1'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(4000001)
                      if len(raw)>4000000:raise ValueError('size limit')
                      text=raw.decode('utf-8','replace');result.update({'status':r.status,'final_url':r.url})
                  soup=BeautifulSoup(text,'html.parser'); title=soup.title.get_text() if soup.title else ''
                  result['title']=title
                  if re.search(r'登录|验证码|Access denied|Just a moment|安全验证',title,re.I):
                      blocked.add(host); result['stop']='login_or_challenge';observations.append(result);print(json.dumps(result,ensure_ascii=False));continue
                  result['links']=[{'href':urllib.parse.urljoin(url,a.get('href','')),'text':a.get_text(' ',strip=True)[:180]} for a in soup.find_all('a') if any(x in a.get('href','') for x in ['mp.weixin.qq.com','/author','/column','/user']) or any(x in a.get_text() for x in ['国君产业','国泰海通政策'])][:100]
                  result['hints']=[m.group(0) for m in list(re.finditer(r'.{0,100}(?:mp\.weixin\.qq\.com|industryRCofG|__biz|var nickname|var user_name|var msg_title).{0,700}',text))[:18]]
                  print(json.dumps(result,ensure_ascii=False),flush=True)
              except urllib.error.HTTPError as exc:
                  result['error']='HTTP '+str(exc.code)
                  if exc.code in [401,403,429]:blocked.add(host)
                  print(result['error'])
              except Exception as exc:result['error']=str(exc)[:250];print(result['error'])
              observations.append(result)
          (out/'public-attribution.json').write_text(json.dumps(observations,ensure_ascii=False,indent=2),encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-verification-${{ github.run_id }}
          path: verification-output/
          retention-days: 14
          if-no-files-found: error
