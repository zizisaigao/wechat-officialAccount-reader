name: Verify account
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/verify-account.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test public channel search and exact-name articles
        shell: python
        run: |
          import urllib.request, urllib.error, re, json, time, pathlib, sys
          sys.path.insert(0,str(pathlib.Path.cwd()))
          import crawl, reader as core
          out=pathlib.Path('verification-output');out.mkdir(exist_ok=True)
          account='国泰海通政策和产业研究院'
          def request(url,body=None):
              time.sleep(1.5)
              headers={'User-Agent':'wechat-officialAccount-reader/0.1','Accept':'application/json,text/html'}
              if body is not None: headers['Content-Type']='application/json'
              req=urllib.request.Request(url,data=None if body is None else json.dumps(body,ensure_ascii=False).encode(),headers=headers)
              with urllib.request.urlopen(req,timeout=25) as r: return r.read(4000000).decode('utf-8','replace')
          audit={'account':account,'url_liveness_checked':False,'complete_history':False}
          try:
              page=request('https://reportify.cn/following/subscribe/add')
              scripts=[s for s in re.findall(r'<script[^>]*src="([^"]+)"',page) if '/app/' in s and '/following/' in s]
              for n,url in enumerate(scripts[:2]):
                  js=request(url);(out/('search-client-'+str(n)+'.txt')).write_text(js,encoding='utf-8')
                  print('CLIENT',url)
                  for pattern in [r'channelService',r'channel_category',r'channel_sub_category']:
                      for m in list(re.finditer(pattern,js))[:6]:print('CALL',js[max(0,m.start()-200):m.start()+1100])
              body={'query':account,'channel_category':3,'channel_sub_category':15,'page_num':1,'page_size':20}
              text=request('https://api.reportify.cn/channels/search',body)
              data=json.loads(text)
              (out/'search-response.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
              print('SEARCH_RESPONSE',json.dumps(data,ensure_ascii=False)[:22000])
              items=data if isinstance(data,list) else data.get('items',[])
              matches={str(o.get('channel_id','')) for o in items if isinstance(o,dict) and account in {core.clean_text(o.get(k)) for k in ['channel_name','chinese_name','chinese_full_name','english_name']}}
              if len(matches)==1:
                  channel=matches.pop()
                  rows,stats=crawl.collect(core.Client(),account,'',channel,1)
                  rows=sorted(rows,key=lambda r:(r.get('published_at',''),r['url']),reverse=True)[:10]
                  audit.update(stats);audit.update({'channel_id':channel,'fetched_articles':len(rows),'status':'collected' if rows else 'empty'})
                  core.export(out,rows,audit,[])
                  print('ARTICLES',json.dumps(rows,ensure_ascii=False))
              else: audit.update({'status':'unresolved_name','exact_matches':sorted(matches)})
          except urllib.error.HTTPError as exc:
              audit.update({'status':'http_error','code':exc.code,'message':exc.read(1500).decode('utf-8','replace')})
          except Exception as exc: audit.update({'status':'error','message':str(exc)[:300]})
          (out/'verification.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          print('AUDIT',json.dumps(audit,ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-verification-${{ github.run_id }}
          path: verification-output/
          retention-days: 14
          if-no-files-found: error
