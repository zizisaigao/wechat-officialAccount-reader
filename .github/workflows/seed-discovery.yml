name: Seed discovery
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/seed-discovery.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements.txt
      - name: Read bounded public seed metadata
        shell: python
        run: |
          import urllib.request as ur, urllib.error, urllib.parse as up
          import pathlib, json, re, time, html
          from bs4 import BeautifulSoup
          out=pathlib.Path('seed-output');out.mkdir(exist_ok=True)
          biz='MzE5ODM1NDY2MA=='
          urls=[
            'https://mp.weixin.qq.com/mp/appmsgalbum?'+up.urlencode({'__biz':biz,'action':'getalbum','album_id':'4434567390462525444'}),
            'https://mp.weixin.qq.com/s?'+up.urlencode({'__biz':biz,'mid':'2247489871','idx':'2','sn':'f89c88fbd4982eb5c527734ca1dc2e9e','chksm':'969daac4a1ea23d2bd5f3e9014930870c7bf0869df708c4f87286e6113921b41b291e9273733'}),
            'https://raw.githubusercontent.com/hellodword/wechat-feeds/main/list.csv',
            'https://www.jintiankansha.me/column/DRnZiENfmE'
          ]
          blocked=set(); observations=[]
          class StopChallenge(ur.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if re.search(r'captcha|/login|/signin',up.urlsplit(newurl).path,re.I):
                      blocked.add(up.urlsplit(req.full_url).hostname)
                      raise ValueError('redirect_to_login_or_captcha')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=ur.build_opener(StopChallenge())
          for url in urls:
              host=up.urlsplit(url).hostname
              if host in blocked:continue
              time.sleep(1.5)
              result={'url':url}
              try:
                  req=ur.Request(url,headers={'User-Agent':'wechat-officialAccount-reader/0.1'})
                  with opener.open(req,timeout=20) as r:
                      raw=r.read(4000001)
                      if len(raw)>4000000:raise ValueError('size_limit')
                      text=raw.decode('utf-8','replace');result['http_status']=r.status
                  if url.endswith('list.csv'):
                      result['matching_registry_rows']=[s for s in text.splitlines() if biz in s or '国泰海通政策' in s or '国君产业' in s]
                  else:
                      soup=BeautifulSoup(text,'html.parser')
                      result['page_title']=soup.title.get_text(strip=True) if soup.title else ''
                      result['identity']={k:[e.get_text(' ',strip=True) for e in soup.select(k)][:4] for k in ['#js_name','#activity-name','.album__author-name','.album__label-title']}
                      result['metas']=[dict(e.attrs) for e in soup.find_all('meta') if e.get('property','') in ['og:title','og:url','og:site_name'] or e.get('name','') in ['author','description']]
                      result['articles']=[dict(e.attrs) for e in soup.select('[data-link]')][:50]
                      result['article_links']=[{'url':html.unescape(up.urljoin(url,a.get('href',''))),'title':a.get_text(' ',strip=True)} for a in soup.find_all('a') if 'mp.weixin.qq.com/s' in a.get('href','') or 'appmsgalbum' in a.get('href','')][:100]
                      result['script_hints']=[m.group(0) for m in list(re.finditer(r'.{0,80}(?:var nickname|var biz|var user_name|var msg_title|album_info|article_list|appmsg_list|album_name|album_title|__biz=).{0,350}',text))[:30]]
                      result['visible_excerpt']=soup.get_text(' ',strip=True)[:3500]
                      if 'appmsgalbum' in url:
                          (out/'album-page.html').write_text(text,encoding='utf-8')
              except urllib.error.HTTPError as e:
                  result['error']='HTTP '+str(e.code)
                  if e.code in [401,403,429]:blocked.add(host)
              except Exception as e:result['error']=str(e)[:200]
              observations.append(result)
              print(json.dumps(result,ensure_ascii=False),flush=True)
          (out/'observations.json').write_text(json.dumps(observations,ensure_ascii=False,indent=2),encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-discovery-${{ github.run_id }}
          path: seed-output/
          retention-days: 3
          if-no-files-found: error
