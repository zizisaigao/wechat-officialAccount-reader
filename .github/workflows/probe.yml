name: Public source probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public index markup (no login or credentials)
        shell: python
        run: |
          import urllib.request, urllib.error, urllib.parse, re, json
          urls=[
            'https://www.jintiankansha.com/column/6VriGs1Enu?type=recent',
            'https://qnmlgb.tech/authors/5c7ff4b2497ff42adc841181',
            'https://qnmlgb.tech/assets/wx/profile.js',
            'https://qnmlgb.tech/assets/wx/home.js',
            'https://www.jintiankansha.com/search?'+urllib.parse.urlencode({'q':'郭磊宏观茶座'}),
            'https://weixin.sogou.com/weixin?'+urllib.parse.urlencode({'type':'2','query':'郭磊宏观茶座'}),
          ]
          for url in urls:
              print('\nSOURCE',url,flush=True)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'wechat-officialAccount-reader/0.1 (+https://github.com/zizisaigao/wechat-officialAccount-reader)'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      text=r.read(1500000).decode('utf-8','replace'); print('HTTP',r.status,'URL',r.url,'LEN',len(text))
                  if 'column/' in url:
                      pos=text.find('广发宏观'); print('ROW',text[max(0,pos-1200):pos+5000])
                      pos=text.find('<form action="/search"'); print('SEARCHFORM',text[pos:pos+2200])
                  elif '.js' in url or 'authors/' in url:
                      print('CONTENT',text[:22000])
                  else:
                      print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',text,re.S))
                      print('LINKS',re.findall(r'<a\b[^>]*href=[\"\x27]([^\"\x27]+)[\"\x27][^>]*>(.*?)</a>',text,re.S)[:35])
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e)[:300])
