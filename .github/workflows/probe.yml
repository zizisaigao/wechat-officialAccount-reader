name: Public source probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public client contract without credentials
        shell: python
        run: |
          import urllib.request,re,time
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'wechat-officialAccount-reader/0.1'}),timeout=10) as r:return r.read(2500000).decode()
          text=get('https://reportify.cn/channels/S10740353838202886/documents')
          urls=re.findall(r'<script[^>]*src="([^"]+)"',text)[:47]
          for url in urls:
              try:
                  js=get(url)
                  if re.search(r'reportServices[:=]|24797:\(',js):
                      print('CLIENT',url,flush=True)
                      print('ENDPOINTS',re.findall(r'apiService\.(?:get|post)\(.{0,180}',js)[:40],flush=True)
                      for term in ['reportServices:', 'reportServices=', '24797:(', 'baseURL:', 'api.reportify', 'query:async']:
                          for m in list(re.finditer(re.escape(term),js))[:2]:print('DEFINITION',js[max(0,m.start()-80):m.start()+1500],flush=True)
                  time.sleep(.2)
              except Exception as e:print('ERROR',type(e).__name__,flush=True)
