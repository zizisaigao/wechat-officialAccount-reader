name: Public source probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test public channel list once without credentials
        shell: python
        run: |
          import urllib.request, urllib.error, json
          url='https://api.reportify.cn/reports?page_num=1&page_size=20&channel_id=S10740353838202886&report_types=12'
          print('SOURCE',url,flush=True)
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'wechat-officialAccount-reader/0.1','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  text=r.read(2000000).decode(); print('HTTP',r.status)
              data=json.loads(text)
              print('SCHEMA',list(data) if isinstance(data,dict) else type(data).__name__)
              if isinstance(data,dict):
                  print('COUNTS',{k:data.get(k) for k in ['total_count','total_page','page_num','page_size','message']})
                  for obj in data.get('items',[])[:20]:
                      print('ARTICLE',json.dumps({k:obj.get(k) for k in ['report_id','title','report_title','publish_at','original_url','channel_id','channel_name','wechat_mp_name']},ensure_ascii=False))
          except urllib.error.HTTPError as e:
              print('STOP_HTTP',e.code,'No retry or credential substitution')
          except Exception as e:print('ERROR',type(e).__name__,str(e)[:180])
