name: Public source probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect alternate public metadata
        shell: python
        run: |
          import urllib.request, urllib.parse, re, json
          urls=[
            'https://reportify.cn/social-media/873209561848390',
            'https://www.bing.com/search?'+urllib.parse.urlencode({'format':'rss','q':'"郭磊宏观茶座"'}),
            'https://wxredian.com',
          ]
          for url in urls:
              print('\nSOURCE',url,flush=True)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'wechat-officialAccount-reader/0.1 (+https://github.com/zizisaigao/wechat-officialAccount-reader)'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      text=r.read(3000000).decode('utf-8','replace'); print('HTTP',r.status,'URL',r.url,'LEN',len(text))
                  print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',text,re.S))
                  if 'format=rss' in url: print('FEED',text[:18000])
                  else:
                      print('LINKS',re.findall(r'<a\b[^>]*href=[\"\x27]([^\"\x27]+)[\"\x27][^>]*>(.*?)</a>',text,re.S)[:18])
                      print('SCRIPTS',re.findall(r'<script[^>]*src=[\"\x27]([^\"\x27]+)',text)[:12])
                      print('WECHAT',[m.group(0) for m in list(re.finditer(r'.{0,150}mp\.weixin\.qq\.com.{0,300}',text))[:8]])
                      for marker in ['__NEXT_DATA__','郭磊宏观茶座','original_url','source_url','sourceUrl','文章来源']:
                          pos=text.find(marker); print('MARKER',marker,text[max(0,pos-200):pos+1600] if pos>=0 else '')
              except Exception as e: print('ERROR',type(e).__name__,str(e)[:250])
