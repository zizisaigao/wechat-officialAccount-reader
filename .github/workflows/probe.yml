name: Public source probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate public metadata parsing
        shell: python
        run: |
          import urllib.request, re, json, time
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'wechat-officialAccount-reader/0.1'}),timeout=15) as r:return r.read(3000000).decode()
          text=get('https://reportify.cn/social-media/873209561848390'); parts=[]
          for m in re.finditer(r'self\.__next_f\.push\((\[.*?\])\)\s*;?\s*</script>',text,re.S):
              try:
                  d=json.loads(m[1])
                  if len(d)>1 and isinstance(d[1],str):parts.append(d[1])
              except ValueError:pass
          flight=''.join(parts)
          for m in re.finditer(r'"main"\s*:\s*(\{)',flight):
              try:
                  obj=json.JSONDecoder().raw_decode(flight[m.start(1):])[0]
                  print('ARTICLE',json.dumps({k:obj.get(k) for k in ['report_id','title','publish_at','original_url','wechat_mp_name','channel_id']},ensure_ascii=False))
              except ValueError as e: print('PARSE_ERROR',str(e))
          channel=get('https://reportify.cn/channels/S10740353838202886/documents')
          scripts=re.findall(r'<script[^>]*src="([^"]+)"',channel)
          print('SCRIPTS',scripts)
          for url in scripts[-20:]:
              try:
                  js=get(url)
                  if 'reportServices' in js or '/reports/query' in js:
                      print('CLIENT',url)
                      for term in ['reportServices:', 'reportServices=', '/reports/query', 'baseURL:', 'api.reportify', 'query:async']:
                          for m in list(re.finditer(re.escape(term),js))[:3]: print('DEFINITION',js[max(0,m.start()-200):m.start()+800])
                  time.sleep(.3)
              except Exception as e:print('ERROR',type(e).__name__)
