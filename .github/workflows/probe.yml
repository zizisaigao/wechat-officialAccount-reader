name: Public source probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect listing service definition
        shell: python
        run: |
          import urllib.request,re
          u='https://files.reportify.cc/fe-static/_next/static/chunks/13910-29bd235562b18499.js'
          with urllib.request.urlopen(u,timeout=20) as r:js=r.read(3000000).decode()
          for pattern in [r'z=new ',r'"/reports"',r'this\.query=',r'defaultRequestOptions',r'baseURL',r'H=\{',r'413120:',r'https?://[^"\s]+']:
              print('PATTERN',pattern)
              for m in list(re.finditer(pattern,js))[:8]:print(js[max(0,m.start()-200):m.start()+1200])
