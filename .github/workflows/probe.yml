name: Public source probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public account indexes (no login or credentials)
        shell: python
        run: |
          import urllib.request, urllib.error, re, json
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.current=None
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='a': self.current=[a.get('href',''),'']
              def handle_data(self, data):
                  if self.current is not None: self.current[1]+=data
              def handle_endtag(self, tag):
                  if tag=='a' and self.current is not None:
                      self.links.append(self.current); self.current=None
          urls=[
            'https://www.jintiankansha.me/column/6VriGs1Enu',
            'https://www.jintiankansha.com/column/6VriGs1Enu?type=recent',
            'https://www.jintiankansha.com/t/7QgciFy7pf',
            'https://freewechat.com/profile/MzI1NzAwODc3Nw==',
            'https://qnmlgb.tech/authors/5c7ff4b2497ff42adc841181',
            'https://mcp.jintiankansha.me',
          ]
          for url in urls:
              print('\nSOURCE',url,flush=True)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'wechat-officialAccount-reader/0.1 (+https://github.com/zizisaigao/wechat-officialAccount-reader)'})
                  with urllib.request.urlopen(req,timeout=22) as r:
                      text=r.read(2500000).decode('utf-8','replace'); print('HTTP',r.status,'URL',r.url,'LEN',len(text))
                  p=Links(); p.feed(text)
                  print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',text,re.S))
                  print('LINKS',json.dumps(p.links[:90],ensure_ascii=False))
                  print('SCRIPTS',re.findall(r'<script[^>]*src=[\"\x27]([^\"\x27]+)',text)[:15])
                  for pattern in [r'.{0,160}mp\.weixin\.qq\.com.{0,300}',r'.{0,100}(__NEXT_DATA__|pagination|article_list|原文|下一页|search).{0,200}']:
                      print('HINTS',[m.group(0) for m in list(re.finditer(pattern,text))[:15]])
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e)[:300])
