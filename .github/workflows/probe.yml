name: Public source probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public list definitions
        shell: python
        run: |
          import urllib.request,re,time,urllib.parse
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'wechat-officialAccount-reader/0.1'}),timeout=10) as r:return r.read(2500000).decode()
          text=get('https://reportify.cn/channels/S10740353838202886/documents')
          urls=re.findall(r'<script[^>]*src="([^"]+)"',text)[:47]
          for url in urls:
              try:
                  js=get(url)
                  for pattern in [r'413120:',r'152273:',r'GN:\(\)=>',r'I=s\(']:
                      for m in list(re.finditer(pattern,js))[:1]:print('DEFINITION',url,pattern,js[max(0,m.start()-80):m.start()+6500],flush=True)
                  time.sleep(.15)
              except Exception as e:print('ERROR',type(e).__name__,flush=True)
          u='https://reportify.cn/tags/concept?'+urllib.parse.urlencode({'tagValue':'经济转型升级'})
          text=get(u)
          print('TAG_ARTICLES',re.findall(r'href="(/social-media/\d+)"',text)[:25],flush=True)
