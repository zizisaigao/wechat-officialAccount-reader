name: Public source probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Reportify channel metadata
        shell: python
        run: |
          import urllib.request, re, json, html
          urls=['https://reportify.cn/channels/S10740353838202886/documents','https://reportify.cn/social-media/873209561848390']
          def walk(v):
              if isinstance(v,dict):
                  if 'original_url' in v or 'channel_name' in v:
                      print('OBJECT',json.dumps({k:x for k,x in v.items() if not isinstance(x,(dict,list)) and len(str(x))<600},ensure_ascii=False))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          for url in urls:
              print('SOURCE',url,flush=True)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'wechat-officialAccount-reader/0.1'}),timeout=25) as r: text=r.read(4000000).decode();print('HTTP',r.status,'LEN',len(text))
                  print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',text,re.S))
                  links=re.findall(r'<a\b[^>]*href=[\"\x27]([^\"\x27]+)[\"\x27][^>]*>(.*?)</a>',text,re.S)
                  print('LINKS',[(u,re.sub('<[^>]+>','',s)[:100]) for u,s in links if '/channels/' in u or '/social-media/' in u or 'page=' in u or 'search' in u][:50])
                  parts=[]
                  for m in re.finditer(r'self\.__next_f\.push\((\[.*?\])\)\s*;?\s*</script>',text,re.S):
                      try:
                          data=json.loads(m[1])
                          if len(data)>1 and isinstance(data[1],str): parts.append(data[1])
                      except ValueError: pass
                  flight=''.join(parts); print('FLIGHT_LEN',len(flight))
                  for m in re.finditer(r'(?:^|\n)[0-9a-f]+:([\[{])',flight):
                      try: value,_=json.JSONDecoder().raw_decode(flight[m.start(1):]);walk(value)
                      except ValueError: pass
                  print('PAGING',[m.group(0) for m in list(re.finditer(r'.{0,150}(pageSize|page_num|pageNum|total_count|has_more|nextCursor|totalCount|cursor|page=).{0,200}',flight))[:15]])
              except Exception as e: print('ERROR',type(e).__name__,str(e)[:200])
